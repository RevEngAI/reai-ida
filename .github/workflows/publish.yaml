name: Publish

on:
  release:
    types: [published]

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Plugin (${{ matrix.platform.os }}, py${{ matrix.python }}, ${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.os }}

    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        platform:
          - os: ubuntu-latest
            arch: x86_64
            package-name: linux_x86_64
          - os: macos-latest
            arch: arm64
            package-name: macos_arm64
          - os: macos-15-intel
            arch: x86_64
            package-name: macos_x86_64
          - os: windows-latest
            arch: x86_64
            package-name: windows_x86_64

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Install build tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Stamp release version into ida-plugin.json
        run: |
          python - <<'PY'
          import json, os

          version = os.environ["RELEASE_TAG"].lstrip("v")
          with open("ida-plugin.json") as fh:
              meta = json.load(fh)
          meta["plugin"]["version"] = version
          with open("ida-plugin.json", "w") as fh:
              json.dump(meta, fh, indent=2)
              fh.write("\n")
          print(f"Stamped ida-plugin.json version = {version}")
          PY
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash

      - name: Build vendor dependencies
        run: |
          rm -rf screenshots
          bash scripts/build_vendor.sh
        shell: bash

      - name: Package plugin for release (cross-platform)
        run: |
          python - <<'PY'
          import zipfile, os
          from pathlib import Path

          os.makedirs("dist", exist_ok=True)
          zip_path = f"dist/reveng_ida_plugin_${{ matrix.platform.package-name }}_py${{ matrix.python }}.zip"

          with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED) as zf:
              # Add the entry file to root
              zf.write("reai_toolkit_entry.py", "reai_toolkit_entry.py")
              
              # Add all files from reai_toolkit/ to root of zip
              for root, dirs, files in os.walk("reai_toolkit"):
                  for file in files:
                      file_path = os.path.join(root, file)
                      # Archive name is relative to reai_toolkit (removes the reai_toolkit/ prefix)
                      arcname = os.path.relpath(file_path, ".")
                      zf.write(file_path, arcname)
          PY
        shell: bash

      - name: Upload plugin artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reveng_ida_plugin_${{ matrix.platform.package-name }}_py${{ matrix.python }}
          path: dist/*.zip

  attach:
    name: Attach Artifacts to GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist

      - name: List artifacts
        run: ls -R dist

      - name: Attach to published release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          name: ${{ github.event.release.name }}
          body: |
            RevEng.AI IDA Plugin

            Extract into your IDA plugins folder.
          files: dist/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
